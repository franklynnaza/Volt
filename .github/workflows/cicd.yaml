name: Build and push docker images to ACR

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Check out the repository
      uses: actions/checkout@v2

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: voltacr.azurecr.io
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push backend
      run: |
        docker build -t voltacr.azurecr.io/volt-backend:${GITHUB_RUN_NUMBER} ./backend
        docker push voltacr.azurecr.io/volt-backend:${GITHUB_RUN_NUMBER}

    - name: Build and push frontend
      run: |
        docker build -t voltacr.azurecr.io/volt-frontend:${GITHUB_RUN_NUMBER} ./frontend
        docker push voltacr.azurecr.io/volt-frontend:${GITHUB_RUN_NUMBER}
