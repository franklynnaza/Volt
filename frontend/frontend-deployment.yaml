apiVersion: apps/v1
kind: Deployment
metadata:
  name: volt-frontend
  labels:
    app: volt-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: volt-frontend
  template:
    metadata:
      labels:
        app: volt-frontend
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: volt-frontend
          image: voltacr.azurecr.io/volt-frontend:2
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: volt-frontend-service
spec:
  type: NodePort
  selector:
    app: volt-frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
